<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="sesion.js" data-pagina="perfiles"></script>
<title>PRUEBA · Equipo y PIN · Yiyi Pash</title><meta name="robots" content="noindex"><script>document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.textContent='PRUEBA · nada de lo que hagas aquí es real';d.style.cssText='position:sticky;top:0;z-index:99999;background:#b91c1c;color:#fff;text-align:center;font:700 13px/1.4 system-ui,sans-serif;padding:6px 8px';document.body.insertBefore(d,document.body.firstChild);});</script><link rel="icon" type="image/png" sizes="32x32" href="https://yiyipash.com/prueba/icono-32.png"><link rel="icon" type="image/png" sizes="192x192" href="https://yiyipash.com/prueba/icono-192.png"><link rel="apple-touch-icon" href="https://yiyipash.com/prueba/icono-180.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Equipo y PIN (fase 2, solo dueños): quién entra al sistema. Perfiles ≠ colaboradores (RH); se ligan por ID. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --on-accent:#ffffff; --bad:#c0262d; --ok:#15803d; --ok-bg:#dcfce7;
  --conf:#4b5a74; --conf2:#dde3ee; --soft:#fff7fb;
  --font:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px}
.volver{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;justify-self:start}
h1{font-weight:700;font-size:23px;line-height:1.2;color:#b82a6c;margin:0;letter-spacing:-.2px}
h2{font-size:15px;margin:0}
.card{background:var(--surface);border:1.5px solid var(--conf2);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:0 2px 0 var(--conf2)}
.card.off{opacity:.75}
input,select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--fg)}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
.btn{border:none;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);font-family:inherit;font-weight:700;font-size:14px;padding:11px 14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--line)}
.btn.mal{background:var(--bad)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.mini:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.mu{font-size:13px;color:var(--mu);margin:0}
.err{color:var(--bad);font-size:13px;margin:0}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin:0}
.cab{display:flex;align-items:center;gap:12px}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--accent)}
.off .av{background:var(--mu)}
.cab b{display:block;font-size:16px}.cab small{display:block;color:var(--mu);font-size:12.5px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1.5px solid var(--line);background:var(--soft)}
.pill.ok2{border-color:#86c9a0;color:var(--ok);background:var(--ok-bg)}
.pill.no{color:var(--mu)}
.acc{display:flex;flex-wrap:wrap;gap:6px}
.mini{border:1.5px solid var(--line);background:#fff;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 12px;cursor:pointer}
.conf{background:#fff4dd;border:1.5px solid #f3d28c;color:#8a5a00;border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px}
.giro{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
#cargador{position:fixed;inset:0;z-index:50;background:rgba(255,225,238,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--accent);text-align:center;padding:24px}
</style>
</head>
<body>
<div class="app">
  <a class="volver" href="./">← Inicio</a>
  <h1>Equipo y PIN</h1>
  <p class="mu">Quién entra al sistema y qué ve. <b>Dueño</b>: todo. <b>Artista</b>: consentimiento, nota y cobro, expediente. <b>iPad</b>: solo consentimiento.</p>
  <p class="ok" id="aviso" hidden></p>
  <p class="err" id="eGeneral" hidden></p>
  <div id="lista" class="app" style="gap:10px;width:100%"></div>
  <form class="card" id="fNuevo">
    <h2>Agregar persona</h2>
    <label for="nNombre">Nombre<input id="nNombre" autocomplete="off" placeholder="Como la conocen en el estudio"></label>
    <label for="nRol">Tipo<select id="nRol"></select></label>
    <label for="nColab">Colaboradora (para "Elaboró" y pagos) <span class="mu">opcional</span><select id="nColab"></select></label>
    <p class="mu">La primera vez que entre, ella crea su PIN contigo o con Yol presentes.</p>
    <button class="btn" type="submit">Agregar</button>
    <p class="err" id="eNuevo" hidden></p>
  </form>
</div>
<div id="cargador" hidden><div class="giro" aria-hidden="true"></div><span id="cargaTxt">Cargando…</span></div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbwOhVk8lowZwedDv-J0wOCparRSL1MZu9ybJXJ6oru5Br87eLRgtO6Ny10sv947ciuv/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const leer=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
let D=null,editando=null,confirmando=null;
async function api(action,data,texto){
  $('cargaTxt').textContent=texto||'Guardando…';$('cargador').hidden=false;
  try{
    const res=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,clave:leer('yp_pink_clave')},data||{})),redirect:'follow'});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Error del servidor');
    return j.data;
  }finally{$('cargador').hidden=true;}
}
function error(id,msg){$(id).textContent=msg||'';$(id).hidden=!msg;}
function aviso(msg){$('aviso').textContent=msg;$('aviso').hidden=!msg;scrollTo(0,0);}
const ROL={'Dueño':'Dueña / dueño','Artista':'Artista','iPad':'iPad del estudio'};
const opcionesRol=sel=>D.roles.map(r=>`<option value="${esc(r)}"${r===sel?' selected':''}>${esc(ROL[r]||r)}</option>`).join('');
const opcionesColab=sel=>'<option value="">Ninguna</option>'+D.colaboradores.map(c=>`<option value="${esc(c.id)}"${c.id===sel?' selected':''}>${esc(c.alias)} · ${esc(c.id)}</option>`).join('');
function pintar(d){
  if(d)D=d;
  const yo=window.YP_SESION&&YP_SESION.id;
  $('lista').innerHTML=D.perfiles.map(p=>{
    const c=D.colaboradores.find(x=>x.id===p.id_colaborador);
    if(editando===p.id)return `<form class="card" data-editar="${esc(p.id)}">
      <h2>Editar a ${esc(p.nombre)}</h2>
      <label>Nombre<input name="nombre" value="${esc(p.nombre)}" autocomplete="off"></label>
      <label>Tipo<select name="rol">${opcionesRol(p.rol)}</select></label>
      <label>Colaboradora<select name="colab">${opcionesColab(p.id_colaborador)}</select></label>
      <button class="btn" type="submit">Guardar</button><button class="btn sec" type="button" data-cancelar>Cancelar</button>
      <p class="err" data-err hidden></p></form>`;
    return `<div class="card${p.activo?'':' off'}" data-id="${esc(p.id)}">
      <div class="cab"><span class="av">${esc(p.nombre.charAt(0).toUpperCase())}</span><span><b>${esc(p.nombre)}${p.id===yo?' <span class="mu">(tú)</span>':''}</b><small>${esc(ROL[p.rol]||p.rol)} · ${esc(p.id)}${c?' · '+esc(c.alias)+' ('+esc(c.id)+')':p.id_colaborador?' · '+esc(p.id_colaborador):''}</small></span></div>
      <div class="pills"><span class="pill ${p.activo?'ok2':'no'}">${p.activo?'Activo':'Desactivado'}</span><span class="pill ${p.tiene_pin?'ok2':'no'}">${p.tiene_pin?'Tiene PIN':'Sin PIN: lo crea al entrar'}</span>${p.ultimo?`<span class="pill">Entró ${esc(p.ultimo)}</span>`:''}</div>
      ${confirmando&&confirmando.id===p.id?`<div class="conf"><span>${confirmando.que==='pin'?`¿Reiniciar el PIN de ${esc(p.nombre)}? Se cierra su sesión en todos los aparatos y la próxima vez crea uno nuevo.`:`¿Desactivar a ${esc(p.nombre)}? Ya no podrá entrar. Todo lo que hizo se queda con su nombre.`}</span>
        <button class="btn ${confirmando.que==='pin'?'':'mal'}" type="button" data-si>${confirmando.que==='pin'?'Sí, reiniciar PIN':'Sí, desactivar'}</button><button class="btn sec" type="button" data-no>Cancelar</button></div>`
      :`<div class="acc"><button class="mini" type="button" data-accion="editar">Editar</button>${p.tiene_pin?'<button class="mini" type="button" data-accion="pin">Reiniciar PIN</button>':''}${p.id===yo?'':`<button class="mini" type="button" data-accion="${p.activo?'baja':'alta'}">${p.activo?'Desactivar':'Activar otra vez'}</button>`}</div>`}
      <p class="err" data-err hidden></p></div>`;
  }).join('');
  $('nRol').innerHTML=opcionesRol('Artista');$('nColab').innerHTML=opcionesColab('');
}
const perfil=id=>D.perfiles.find(p=>p.id===id);
async function guardar(p,cambios,msg,el){
  try{editando=null;confirmando=null;pintar(await api('consent_perf_guardar',Object.assign({id:p.id,nombre:p.nombre,rol:p.rol,id_colaborador:p.id_colaborador,activo:p.activo},cambios)));aviso(msg);}
  catch(x){pintar();const e=$('lista').querySelector(`[data-id="${CSS.escape(p.id)}"] [data-err],[data-editar="${CSS.escape(p.id)}"] [data-err]`);if(e){e.textContent=x.message;e.hidden=false;}}
}
$('lista').onclick=async e=>{
  const card=e.target.closest('[data-id]'),b=e.target.closest('button');
  if(e.target.closest('[data-cancelar]')){editando=null;return pintar();}
  if(!card||!b)return;
  const p=perfil(card.dataset.id);
  if(b.hasAttribute('data-no')){confirmando=null;return pintar();}
  if(b.hasAttribute('data-si')){
    if(confirmando.que==='pin'){try{confirmando=null;pintar(await api('consent_perf_reiniciar',{id:p.id},'Reiniciando PIN…'));aviso('PIN de '+p.nombre+' reiniciado. La próxima vez que entre, crea uno nuevo.');}catch(x){pintar();aviso('');}return;}
    return guardar(p,{activo:false},p.nombre+' quedó desactivada.');
  }
  const a=b.dataset.accion;
  if(a==='editar'){editando=p.id;confirmando=null;return pintar();}
  if(a==='pin'||a==='baja'){confirmando={id:p.id,que:a};return pintar();}
  if(a==='alta')return guardar(p,{activo:true},p.nombre+' puede entrar otra vez (con su mismo PIN).');
};
$('lista').addEventListener('submit',e=>{
  const f=e.target.closest('[data-editar]');if(!f)return;e.preventDefault();
  const p=perfil(f.dataset.editar);
  guardar(p,{nombre:f.nombre.value.trim(),rol:f.rol.value,id_colaborador:f.colab.value},'Cambios guardados.');
});
$('fNuevo').onsubmit=async e=>{
  e.preventDefault();error('eNuevo','');
  const nombre=$('nNombre').value.trim();if(!nombre)return error('eNuevo','Escribe el nombre.');
  try{pintar(await api('consent_perf_guardar',{nombre,rol:$('nRol').value,id_colaborador:$('nColab').value},'Agregando…'));$('nNombre').value='';aviso(nombre+' ya está en el equipo. La primera vez que entre, crea su PIN.');}
  catch(x){error('eNuevo',x.message);}
};
async function iniciar(){
  try{pintar(await api('consent_perf_admin',{},'Cargando el equipo…'));}
  catch(x){error('eGeneral',x.message);}
}
if(window.YP_SESION)iniciar();else document.addEventListener('yp-sesion',iniciar,{once:true});
</script>
</body>
</html>
