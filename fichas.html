<style>
/* Fichas del día para la perforadora: una tarjeta por clienta, lo de salud en rojo. Misma marca que el consentimiento. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --soft:#ffd3e6; --on-accent:#ffffff;
  --bad:#c0262d; --bad-bg:#fde8e8; --warn-bg:#fef3c7; --warn-fg:#92400e; --ok:#15803d; --ok-bg:#dcfce7;
  --font:'Montserrat',system-ui,sans-serif; --title:'Titan One','Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{height:42px;width:auto;display:block}
h1{font-family:var(--title);font-weight:400;font-size:26px;line-height:1.15;color:#e8509a;margin:8px 0 4px;
  -webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:3px 3px 0 #f7a9cc}
.dia{display:flex;align-items:center;gap:8px;margin-top:6px}
.dia b{flex:1;text-align:center;font-size:15px}
.btn{border:none;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);
  font-family:inherit;font-weight:700;font-size:14px;padding:10px 14px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--accent);border:1.5px solid var(--line)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.estado{font-size:12px;color:var(--mu);margin-top:6px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 2px 0 #f8c4dc;padding:14px 16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nom b{font-size:20px;display:block;line-height:1.2}
.nom small{color:var(--mu);font-size:12.5px}
.hora{font-weight:700;color:var(--accent);white-space:nowrap;text-align:right}
.hora small{display:block;font-weight:500;color:var(--mu);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--accent)}
.pill.menor{background:var(--warn-bg);color:var(--warn-fg)}
.pill.nueva{background:var(--ok-bg);color:var(--ok)}
.perfos{display:flex;flex-direction:column;gap:4px;font-size:15px}
.perfos div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.perfos span:last-child{color:var(--mu);font-size:13px;white-space:nowrap}
.salud{background:var(--bad-bg);border-left:5px solid var(--bad);border-radius:12px;padding:10px 12px;font-size:14px}
.salud b{color:var(--bad)}
.salud.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.salud.ok b{color:var(--ok)}
.salud ul{margin:4px 0 0;padding-left:18px}
.miedo{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:8px 12px;font-size:14px}
.nota{font-size:14px;border-left:4px solid var(--line);padding-left:10px;color:var(--fg)}
.pie{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mu)}
.pie a{color:var(--accent);font-weight:600}
.vacio{text-align:center;color:var(--mu);padding:40px 10px}
.clave{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.clave input{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:16px}
.err{color:var(--bad);font-size:14px}
/* Buscador de clientas */
.buscar{position:relative;margin-top:8px}
.buscar input,.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:16px;background:var(--surface);color:var(--fg)}
.res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;z-index:8;max-height:50vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.res button{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.res button small{color:var(--mu)}
/* Expediente (pantalla completa) */
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.panel .app{padding-top:12px}
.sec2{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 6px}
.perfo{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:6px;font-size:14px}
.perfo small{display:block;color:var(--mu);font-size:12px}
.est{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.est.Curando{background:var(--warn-bg);color:var(--warn-fg)}.est.Sana{background:var(--ok-bg);color:var(--ok)}
.est.Retirada,.est.Histórico{background:#eee;color:#555}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:12px}
.ev{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;position:relative}
.ev::before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg)}
.ev .f{font-size:12px;color:var(--mu)}
.ev .prox{margin-top:6px;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;cursor:pointer;border:1.5px solid var(--line)}
.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--mu);margin-top:10px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--fg);font-weight:400}
.checks label{display:flex;gap:8px;align-items:center}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.fila{display:flex;gap:8px;align-items:center}
.visor{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}
.visor img{max-width:100%;max-height:90vh;border-radius:12px}
</style>

<div class="panel" id="panel" hidden><div class="app">
  <div class="brand"><button class="btn sec" type="button" id="cerrarPanel">← Volver</button><button class="btn" type="button" id="btnAnotar">+ Anotar visita</button></div>
  <div id="expCont"></div>
  <div class="card" id="formVisita" hidden>
    <b style="font-size:17px">Anotar visita</b>
    <label class="campo">Tipo de visita<select id="vTipo"></select></label>
    <div class="campo">¿Qué revisaste?<div class="checks" id="vPerfos"></div></div>
    <label class="campo">¿Qué se vio?<textarea id="vObs" rows="3" placeholder="Ej. Se colocan aros por inflamación"></textarea></label>
    <div class="campo">¿Cómo quedan?<div class="chips" id="vEstado">
      <button class="chip" type="button" data-e="" aria-pressed="true">No cambia</button><button class="chip" type="button" data-e="Curando" aria-pressed="false">Curando</button>
      <button class="chip" type="button" data-e="Sana" aria-pressed="false">Sana</button><button class="chip" type="button" data-e="Retirada" aria-pressed="false">Retirada</button></div></div>
    <label class="campo">Próxima acción <span style="font-weight:400">(opcional; ese día sale el recordatorio)</span><input type="text" id="vAccion" placeholder="Ej. Retiro de aros de silicón"></label>
    <div class="campo">¿En cuántos días?<div class="fila"><input type="number" id="vDias" min="1" inputmode="numeric" style="max-width:110px">
      <div class="chips" style="margin:0"><button class="chip" type="button" data-d="7">7</button><button class="chip" type="button" data-d="14">14</button><button class="chip" type="button" data-d="30">30</button></div></div></div>

    <div class="fila"><button class="btn sec" type="button" id="vCancelar">Cancelar</button><button class="btn" type="button" id="vGuardar" style="flex:1">Guardar visita</button></div>
  </div>
</div></div>

<script>
const URL_API='https://script.google.com/macros/s/AKfycbwOhVk8lowZwedDv-J0wOCparRSL1MZu9ybJXJ6oru5Br87eLRgtO6Ny10sv947ciuv/exec';
// Demo fuera de GitHub (o con ?demo): datos inventados, no se conecta.
const DEMO=!/(\.github\.io|(^|\.)yiyipash\.com)$/.test(location.hostname)||/[?&]demo/.test(location.search);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const S={fecha:hoyISO(),fichas:[],filtro:'Todas',cargando:false};

async function api(action,data){
  const r=await fetch(URL_API,{method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',
    body:JSON.stringify(Object.assign({action,clave:store.get('yp_pink_clave')||''},data||{}))});
  const j=await r.json();
  if(!j.ok){if(/Clave de equipo/i.test(j.error||''))store.del('yp_pink_clave');throw new Error(j.error||'Error del servidor');}
  return j.data;
}
const DEMO_FICHAS=[
  {id_consent:'CON-000999',id_clienta:'ANA-0001',hora:'12:40',lugar:'Yiyipash Studio',atendio:'Luis',apodo:'Ana (ejemplo)',nombre:'Ana Ejemplo Ficticia',edad:15,
   tutor:{nombre:'María Ficticia',parentesco:'Madre'},visitas_antes:1,perforaciones:[{zona:'Helix',lado:'Izquierdo',perforadora:'Kat'}],
   sangre:'O+',enfermedades:'Ansiedad',condiciones:'Ninguna',fobias:'Agujas (cánulas o catéteres)',alergias:'Níquel',medicamentos:'',comentarios:'',notas_equipo:'Quiere aro de titanio',url_pdf:''},
  {id_consent:'CON-000998',id_clienta:'LUI-0001',hora:'11:05',lugar:'Yiyipash Studio',atendio:'Yiyi',apodo:'Luis',nombre:'Luis Enrique Lopez Pacheco',edad:24,
   tutor:null,visitas_antes:0,perforaciones:[{zona:'Lóbulo',lado:'Izquierdo',perforadora:'Yiyi'},{zona:'Lóbulo',lado:'Derecho',perforadora:'Yiyi'}],
   sangre:'A+',enfermedades:'Ninguna',condiciones:'Ninguna',fobias:'Ninguno',alergias:'',medicamentos:'',comentarios:'',notas_equipo:'',url_pdf:''},
];

async function cargar(){
  if(S.cargando)return;
  if(!DEMO&&!store.get('yp_pink_clave')){$('claveBox').hidden=false;$('lista').innerHTML='';return;}
  S.cargando=true;$('estado').textContent='Cargando…';$('err').textContent='';
  try{
    const d=DEMO?{fecha:S.fecha,fichas:S.fecha===hoyISO()?DEMO_FICHAS:[]}:await api('consent_fichas',{fecha:S.fecha});
    if(d.fecha!==S.fecha)return;
    S.fichas=d.fichas;
    $('estado').textContent=`${d.fichas.length} ${d.fichas.length===1?'clienta':'clientas'} · actualizado ${new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}${DEMO?' · DEMO':''}`;
    pintar();
  }catch(x){
    $('estado').textContent='';$('err').textContent=x.message;
    if(!store.get('yp_pink_clave'))$('claveBox').hidden=false;
  }finally{S.cargando=false;}
}
const ningun=s=>!s||/^(ningun[oa]s?|no|-|n\/a)$/i.test(String(s).trim());
const lista=s=>String(s||'').split(',').map(x=>x.trim()).filter(x=>x&&!ningun(x));
function pintar(){
  const d=new Date(S.fecha+'T12:00');
  $('fechaTxt').textContent=(S.fecha===hoyISO()?'Hoy, ':'')+d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});
  $('despues').disabled=S.fecha>=hoyISO();
  // Filtro por perforadora: las que aparecen ese día
  const perfs=[...new Set(S.fichas.flatMap(f=>f.perforaciones.map(p=>p.perforadora)).filter(Boolean))];
  if(S.filtro!=='Todas'&&!perfs.includes(S.filtro))S.filtro='Todas';
  $('filtro').innerHTML=perfs.length>1?['Todas',...perfs].map(p=>`<button class="chip" type="button" data-p="${esc(p)}" aria-pressed="${p===S.filtro}">${esc(p)}</button>`).join(''):'';
  $('filtro').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.p;pintar();});
  const ver=S.fichas.filter(f=>S.filtro==='Todas'||f.perforaciones.some(p=>p.perforadora===S.filtro));
  $('lista').innerHTML=ver.length?ver.map(ficha).join(''):`<div class="vacio">${S.fecha===hoyISO()?'Todavía no hay consentimientos hoy.':'No hubo consentimientos este día.'}</div>`;
}
function ficha(f){
  const alertas=[];
  lista(f.enfermedades).forEach(x=>alertas.push(x));
  lista(f.condiciones).forEach(x=>alertas.push(x));
  if(!ningun(f.alergias))alertas.push('Alergia: '+f.alergias);
  if(!ningun(f.medicamentos))alertas.push('Toma: '+f.medicamentos);
  const miedos=lista(f.fobias);
  const viejo=/^Migrado/.test(f.origen||'');                   // consentimientos del Form viejo: no preguntaba alergias ni medicamentos
  const perfs=f.perforaciones.map(p=>`<div><span>${esc(p.zona)}${p.lado&&p.lado!=='Centro'?' '+esc(p.lado.toLowerCase()):''}${p.detalle?`<br><small style="color:var(--mu)">${esc(p.detalle)}</small>`:''}</span><span>${esc(p.perforadora||'')}</span></div>`).join('');
  return `<article class="card">
    <div class="top">
      <div class="nom"><b>${esc(f.apodo||f.nombre)}</b><small>${esc(f.nombre)} · ${esc(f.id_clienta)}</small></div>
      <div class="hora">${esc(f.hora)}<small>${esc(f.lugar)}</small></div>
    </div>
    <div class="pills">
      <span class="pill">${f.edad!==''&&f.edad!=null?esc(f.edad)+' años':'Edad sin dato'}</span>
      ${f.tutor?`<span class="pill menor">Menor · firmó ${esc((f.tutor.parentesco||'tutor').toLowerCase())}: ${esc(f.tutor.nombre)}</span>`:''}
      <span class="pill ${f.visitas_antes?'':'nueva'}">${f.visitas_antes?`Ya vino ${f.visitas_antes} ${f.visitas_antes===1?'vez':'veces'}`:'Primera vez'}</span>
      ${f.sangre?`<span class="pill">Sangre ${esc(f.sangre)}</span>`:''}
    </div>
    <div class="perfos">${perfs||'<div><span>Sin zona registrada</span><span></span></div>'}</div>
    ${alertas.length?`<div class="salud"><b>⚠️ Revisa antes de perforar</b><ul>${alertas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`
      :viejo?`<div class="miedo">Sin enfermedades registradas. <b>Formato anterior:</b> no se preguntó por alergias, medicamentos ni tipo de sangre; pregúntaselo.</div>`
      :`<div class="salud ok"><b>✓ Sin enfermedades, alergias ni medicamentos</b></div>`}
    ${alertas.length&&viejo?`<div class="miedo"><b>Formato anterior:</b> no se preguntó por alergias, medicamentos ni tipo de sangre; pregúntaselo.</div>`:''}
    ${miedos.length?`<div class="miedo">😰 Le da miedo: ${esc(miedos.join(', '))}. Explícale cada paso con calma.</div>`:''}
    ${f.comentarios?`<div class="nota"><b>Comentario:</b> ${esc(f.comentarios)}</div>`:''}
    ${f.notas_equipo?`<div class="nota"><b>Nota del equipo:</b> ${esc(f.notas_equipo)}</div>`:''}
    <div class="pie"><span>${esc(f.id_consent)}${f.atendio?' · atendió '+esc(f.atendio):''}</span>${f.url_pdf?`<a href="${esc(f.url_pdf)}" target="_blank" rel="noopener">Ver PDF</a>`:''}</div>
    <button class="btn sec" type="button" data-exp="${esc(f.id_clienta)}">Ver expediente / anotar visita</button>
  </article>`;
}
function moverDia(n){const d=new Date(S.fecha+'T12:00');d.setDate(d.getDate()+n);
  S.fecha=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');S.fichas=[];pintar();cargar();}
$('antes').onclick=()=>moverDia(-1);
$('despues').onclick=()=>moverDia(1);
$('recargar').onclick=cargar;
$('entrar').onclick=async()=>{
  const c=$('clave').value.trim();if(!c)return;
  store.set('yp_pink_clave',c);
  try{await api('pink_validar_clave');$('claveBox').hidden=true;$('clave').value='';cargar();}
  catch(x){$('err').textContent=x.message;}
};
// Se actualiza sola cada minuto mientras la página está a la vista
setInterval(()=>{if(!document.hidden&&S.fecha===hoyISO())cargar();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargar();});
// ── Buscador: la lista de clientas (sin salud) se baja una vez y se busca en el celular ──
const norm=s=>String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim();
let LISTA=null,listaProm=null;
function cargarLista(){
  if(DEMO){LISTA=DEMO_FICHAS.map(f=>({id:f.id_clienta,apodo:f.apodo,nombre:f.nombre,wa:'5500000000'}));return Promise.resolve();}
  if(!listaProm)listaProm=api('consent_lista').then(d=>{LISTA=d.personas;},x=>{listaProm=null;throw x;});
  return listaProm;
}
$('buscar').addEventListener('input',async()=>{
  const raw=$('buscar').value.trim(),q=norm(raw),qd=raw.replace(/\D/g,''),qu=raw.toUpperCase();
  if(q.length<2){$('res').hidden=true;return;}
  if(!LISTA){$('res').hidden=false;$('res').innerHTML='<button type="button" disabled>Cargando la lista…</button>';
    try{await cargarLista();}catch(x){$('res').innerHTML=`<button type="button" disabled>${esc(x.message)}</button>`;return;}
    if($('buscar').value.trim()!==raw)return;}
  const hits=LISTA.filter(p=>p.id===qu||norm(p.nombre).includes(q)||norm(p.apodo).includes(q)||(qd.length>=4&&String(p.wa).includes(qd))).slice(0,12);
  $('res').hidden=false;
  $('res').innerHTML=hits.length?hits.map(p=>`<button type="button" data-exp="${esc(p.id)}"><b>${esc(p.apodo)}</b> · ${esc(p.nombre)}<br><small>${esc(p.id)} · WhatsApp …${esc(String(p.wa).slice(-4))}</small></button>`).join('')
    :'<button type="button" disabled>No la encontré.</button>';
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-exp]');
  if(b){e.preventDefault();$('res').hidden=true;$('buscar').value='';abrirExp(b.dataset.exp);return;}
  if(!e.target.closest('.buscar'))$('res').hidden=true;
});

// ── Expediente de la clienta ──
const E={id:'',d:null};
async function abrirExp(id){
  if(DEMO){alert('En la demo no hay expedientes. Ya conectado, aquí ves toda la historia de la clienta.');return;}
  E.id=id;E.d=null;$('panel').hidden=false;$('formVisita').hidden=true;$('btnAnotar').hidden=false;window.scrollTo(0,0);$('panel').scrollTop=0;
  $('expCont').innerHTML='<p class="estado">Cargando expediente…</p>';
  try{E.d=await api('consent_expediente',{id});pintarExp();}
  catch(x){$('expCont').innerHTML=`<p class="err">${esc(x.message)}</p>`;}
}
$('cerrarPanel').onclick=()=>{$('panel').hidden=true;};
const fmtF=iso=>iso?new Date(iso+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'';
const zonaTxt=p=>p.zona+(p.lado&&p.lado!=='Centro'?' '+p.lado.toLowerCase():'');
function pintarExp(){
  const d=E.d,p=d.persona,ult=d.consentimientos[0];
  // Salud de su último consentimiento
  let salud='<p class="estado">Sin consentimientos.</p>';
  if(ult){
    const al=[...lista(ult.enfermedades),...lista(ult.condiciones)];
    if(!ningun(ult.alergias))al.push('Alergia: '+ult.alergias);
    if(!ningun(ult.medicamentos))al.push('Toma: '+ult.medicamentos);
    const viejo=/^Migrado/.test(ult.origen),miedos=lista(ult.fobias);
    salud=(al.length?`<div class="salud"><b>⚠️ Revisa antes de atender</b><ul>${al.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`
      :viejo?'':`<div class="salud ok"><b>✓ Sin enfermedades, alergias ni medicamentos</b></div>`)
      +(viejo?`<div class="miedo" style="margin-top:6px">${al.length?'':'Sin enfermedades registradas. '}<b>Formato anterior:</b> no se preguntó por alergias, medicamentos ni tipo de sangre.</div>`:'')
      +(miedos.length?`<div class="miedo" style="margin-top:6px">😰 Le da miedo: ${esc(miedos.join(', '))}</div>`:'')
      +`<p class="estado">Según su consentimiento del ${esc(fmtF(ult.fecha))}${ult.sangre?' · Sangre '+esc(ult.sangre):''}</p>`;
  }
  const tats=(d.tatuajes||[]).map(x=>`<div class="perfo"><span>🖋️ ${esc(x.zona)}<small>${esc(fmtF(x.fecha))}${x.tatuadora?' · '+esc(x.tatuadora):''} · ${esc([x.dimensiones,x.color,x.tipo].filter(Boolean).join(' · '))}${x.prueba?' · alergia: '+esc(x.prueba):''}${x.no_nota?' · Nota '+esc(x.no_nota):''}</small></span><span class="est ${esc(x.estado)}">${esc(x.estado||'—')}</span></div>`).join('');
  const perfos=d.perforaciones.map(x=>`<div class="perfo"><span>${esc(zonaTxt(x))}<small>${esc(fmtF(x.fecha))}${x.perforadora?' · '+esc(x.perforadora):''}${x.no_nota?' · Nota '+esc(x.no_nota):''}</small></span><span class="est ${esc(x.estado)}">${esc(x.estado||'—')}</span></div>`).join('')||'<p class="estado">Sin perforaciones registradas.</p>';
  // Línea de tiempo: consentimientos y visitas, lo más nuevo arriba
  const todos=[...d.perforaciones,...(d.tatuajes||[]).map(t=>({...t,zona:'Tatuaje en '+t.zona,lado:''}))];
  const zonas=ids=>ids.split(',').map(s=>s.trim()).map(i=>todos.find(x=>x.id===i)).filter(Boolean).map(zonaTxt).join(', ');
  const ev=[
    ...d.consentimientos.map(c=>({k:c.fecha+c.hora,h:`<div class="ev"><b>📄 Consentimiento</b> <span class="f">${esc(fmtF(c.fecha))} ${esc(c.hora)} · ${esc(c.lugar)}${c.atendio?' · atendió '+esc(c.atendio):''}</span>
      ${todos.filter(x=>x.id_consent===c.id).length?`<div>${esc(todos.filter(x=>x.id_consent===c.id).map(zonaTxt).join(', '))}</div>`:''}
      ${c.notas_equipo?`<div class="f">Nota del equipo: ${esc(c.notas_equipo)}</div>`:''}
      ${c.url_pdf?`<a href="${esc(c.url_pdf)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;font-size:13px">Ver PDF</a>`:''}</div>`})),
    ...d.visitas.map(v=>({k:v.fecha+v.hora,h:`<div class="ev"><b>🩺 ${esc(v.tipo)}</b> <span class="f">${esc(fmtF(v.fecha))} ${esc(v.hora)}${v.atendio?' · '+esc(v.atendio):''}</span>
      ${v.perfos?`<div class="f">${esc(zonas(v.perfos))}</div>`:''}
      ${v.obs?`<div>${esc(v.obs)}</div>`:''}
      ${v.estado?`<div class="f">Queda: <span class="est ${esc(v.estado)}">${esc(v.estado)}</span></div>`:''}
      ${v.accion?`<div class="prox">⏰ ${esc(v.accion)} · ${esc(fmtF(v.fecha_accion))}</div>`:''}
      ${v.fotos.length?`<div class="thumbs">${v.fotos.map(f=>f.mini?`<img src="${esc(f.mini)}" data-foto="${esc(f.id)}" alt="Foto de evolución">`
        :`<button class="btn sec" type="button" data-foto="${esc(f.id)}" style="width:76px;height:76px;font-size:24px">📷</button>`).join('')}</div>`:''}</div>`})),
  ].sort((a,b)=>a.k<b.k?1:-1);
  $('expCont').innerHTML=`<div class="card">
      <div class="top"><div class="nom"><b>${esc(p.apodo)}</b><small>${esc(p.nombre)} · ${esc(p.id)}</small></div></div>
      <div class="pills"><span class="pill">${p.edad!==''?esc(p.edad)+' años':'Edad sin dato'}</span>
        ${p.tipo!=='Titular'&&p.tutor?`<span class="pill menor">Menor · ${esc((p.tutor.parentesco||'tutor').toLowerCase())}: ${esc(p.tutor.nombre)}</span>`:''}
        <span class="pill">WhatsApp …${esc(p.wa4)}</span></div>
      ${salud}</div>
    <div class="sec2">Perforaciones</div>${perfos}
    ${tats?`<div class="sec2">Tatuajes</div>${tats}`:''}
    <div class="sec2">Historia</div><div class="tl">${ev.map(x=>x.h).join('')||'<p class="estado">Sin historia.</p>'}</div>`;
}
// Ver una foto en grande (se pide al servidor; no se da acceso a Drive)
document.addEventListener('click',async e=>{
  const img=e.target.closest('[data-foto]');if(!img)return;
  $('visor').hidden=false;$('visorImg').src=img.src||'';
  try{const r=await api('consent_foto_ver',{id:img.dataset.foto});$('visorImg').src=r.foto;}catch(x){}
});
$('visor').onclick=()=>{$('visor').hidden=true;$('visorImg').src='';};

// ── Anotar visita ──
let vEstado='';
$('btnAnotar').onclick=()=>{
  const d=E.d;if(!d)return;
  $('vTipo').innerHTML=d.tipos.map(t=>`<option>${esc(t)}</option>`).join('');
  const items=[...d.perforaciones,...(d.tatuajes||[]).map(t=>({...t,zona:'🖋️ Tatuaje en '+t.zona,lado:''}))];
  const activas=items.filter(x=>x.estado==='Curando');
  $('vPerfos').innerHTML=items.length?items.map(x=>`<label><input type="checkbox" value="${esc(x.id)}"${activas.includes(x)?' checked':''}> ${esc(zonaTxt(x))} <small style="color:var(--mu)">(${esc(fmtF(x.fecha))})</small></label>`).join('')
    :'<span class="estado">Sin perforaciones ni tatuajes registrados.</span>';
  ['vObs','vAccion','vDias'].forEach(i=>$(i).value='');$('vFotos').value='';$('vErr').textContent='';
  vEstado='';$('vEstado').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.e===''));
  $('formVisita').hidden=false;$('btnAnotar').hidden=true;$('formVisita').scrollIntoView({behavior:'smooth'});
};
$('vEstado').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{vEstado=c.dataset.e;$('vEstado').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));});
document.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{$('vDias').value=c.dataset.d;});
$('vCancelar').onclick=()=>{$('formVisita').hidden=true;$('btnAnotar').hidden=false;};
// Reduce la foto a 1600 px para que suba rápido
function reducir(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82));};
  img.onerror=()=>no(new Error('No pude leer la foto '+file.name));img.src=u;});}
$('vGuardar').onclick=async()=>{
  const accion=$('vAccion').value.trim(),dias=+$('vDias').value||0;
  if(accion&&dias<=0){$('vErr').textContent='Pon en cuántos días es la próxima acción.';$('vDias').focus();return;}
  const b=$('vGuardar');b.disabled=true;b.textContent='Guardando…';$('vErr').textContent='';
  try{
    const r=await api('consent_visita',{id_clienta:E.id,tipo:$('vTipo').value,obs:$('vObs').value.trim(),estado:vEstado,accion,dias,
      perfos:[...$('vPerfos').querySelectorAll('input:checked')].map(i=>i.value),
      atiende:{id:store.get('ypp_elaboro_id')||'',alias:store.get('ypp_elaboro_alias')||''}});
    const fotos=[...$('vFotos').files];
    for(let i=0;i<fotos.length;i++){b.textContent=`Subiendo foto ${i+1} de ${fotos.length}…`;
      await api('consent_foto',{id_visita:r.id_visita,foto:await reducir(fotos[i])});}
    $('formVisita').hidden=true;$('btnAnotar').hidden=false;
    await abrirExp(E.id);
  }catch(x){$('vErr').textContent='No se guardó: '+x.message;}
  finally{b.disabled=false;b.textContent='Guardar visita';}
};

pintar();cargar();
if(!DEMO&&store.get('yp_pink_clave'))cargarLista().catch(()=>{});
</script>
