/* Panel de clientas: corregir datos de contacto sin entrar a Sheets. Misma marca que Fichas. */
:root{
  --bg:#ffe1ee; --surface:#ffffff; --fg:#3b1f2e; --mu:#7d5468; --line:#f8c4dc;
  --accent:#d6347f; --accent2:#ff74af; --on-accent:#ffffff; --bad:#c0262d; --ok:#15803d; --ok-bg:#dcfce7;
  --font:'Montserrat',system-ui,sans-serif; --title:'Titan One','Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:grid;gap:12px}
.logo{height:42px;width:auto;display:block}
.volver{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:none;padding:0;font-family:inherit;cursor:pointer;justify-self:start}
h1{font-family:var(--title);font-weight:400;font-size:26px;line-height:1.15;color:#e8509a;margin:0;
  -webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:3px 3px 0 #f7a9cc}
h2{font-size:15px;margin:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--fg)}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
.btn{border:none;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);font-family:inherit;font-weight:700;font-size:14px;padding:11px 14px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.res:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--fg);cursor:pointer}
.res b{display:block}
.res small,.mu{font-size:13px;color:var(--mu)}
.mu{margin:0}
.err{color:var(--bad);font-size:13px;margin:0}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin:0}
.lista{display:grid;gap:8px}
.ev{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
</style>
</head>

  <h1>Panel de clientas</h1>

  <section id="vBuscar" class="lista">
    <label for="q">Buscar clienta<input type="search" id="q" placeholder="Nombre, apodo, ID o WhatsApp" autocomplete="off"></label>
    <p class="err" id="eBuscar" hidden></p>
    <p class="mu" id="estado"></p>
    <div class="lista" id="res"></div>
  </section>

  <section id="vClienta" class="lista" hidden>
    <p class="ok" id="aviso" hidden></p>
    <form class="card" id="f">
      <h2 id="tit"></h2>
      <p class="mu" id="sub"></p>
      <label for="apodo">Apodo<input id="apodo" autocomplete="off"></label>
      <label for="nombre">Nombre completo<input id="nombre" autocomplete="off"></label>
      <label for="whatsapp">WhatsApp<input id="whatsapp" inputmode="tel" autocomplete="off"></label>
      <label for="email">Correo<input id="email" inputmode="email" autocomplete="off"></label>
      <div id="bTutor" class="lista" hidden>
        <label for="tutor_nombre">Nombre del tutor<input id="tutor_nombre" autocomplete="off"></label>
        <label for="tutor_parentesco">Parentesco<input id="tutor_parentesco" autocomplete="off"></label>
        <label for="tutor_whatsapp">WhatsApp del tutor<input id="tutor_whatsapp" inputmode="tel" autocomplete="off"></label>
      </div>
      <label for="fn">Fecha de nacimiento<input type="date" id="fn"></label>
      <label for="claveD" id="lClave" hidden>Clave de Luis y Yoltic (para cambiar la fecha)<input type="password" id="claveD" autocomplete="off"></label>
      <label for="por">¿Quién hace el cambio?<input id="por" autocomplete="off"></label>
      <p class="mu">Aquí no se cambia la salud ni lo que ya firmó la clienta.</p>
      <p class="err" id="eForm" hidden></p>
      <button class="btn" type="submit" id="bGuardar">Guardar cambios</button>
    </form>
    <div class="card" id="historial" hidden></div>
  </section>
</div>
<script>
const AS_URL='https://script.google.com/macros/s/AKfycbwOhVk8lowZwedDv-J0wOCparRSL1MZu9ybJXJ6oru5Br87eLRgtO6Ny10sv947ciuv/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim();
const leer=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const CAMPOS=['apodo','nombre','whatsapp','email','tutor_nombre','tutor_parentesco','tutor_whatsapp'];
const NOMBRES={Apodo:'apodo',Nombre_Completo:'nombre',WhatsApp:'WhatsApp',Email:'correo',Tutor_Nombre:'nombre del tutor',Tutor_Parentesco:'parentesco',Tutor_WhatsApp:'WhatsApp del tutor',Fecha_Nacimiento:'fecha de nacimiento'};
const TIPOS={Titular:'Mayor de edad',Menor_12_17:'Menor de edad',Dependiente_menor_12:'Menor de 12 años'};
let LISTA=null,listaProm=null,actual=null;
async function api(action,data){
  const res=await fetch(AS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,clave:leer('yp_pink_clave')},data||{})),redirect:'follow'});
  const j=await res.json();
  if(!j.ok)throw new Error(j.error||'Error del servidor');
  return j.data;
}
function error(id,msg){$(id).textContent=msg||'';$(id).hidden=!msg;}
function cargarLista(){
  if(!listaProm)listaProm=api('consent_lista').then(d=>{LISTA=d.personas;},x=>{listaProm=null;throw x;});
  return listaProm;
}
async function buscar(){
  error('eBuscar','');
  if(!leer('yp_pink_clave'))return error('eBuscar','Este celular no tiene la clave. Ponla en Inicio.');
  const raw=$('q').value.trim(),q=norm(raw),qd=raw.replace(/\D/g,''),qu=raw.toUpperCase();
  if(q.length<2){$('res').innerHTML='';$('estado').textContent='';return;}
  if(!LISTA){$('estado').textContent='Cargando clientas…';
    try{await cargarLista();}catch(x){$('estado').textContent='';return error('eBuscar',x.message);}
    if($('q').value.trim()!==raw)return;}
  const hits=LISTA.filter(p=>p.id===qu||norm(p.nombre).includes(q)||norm(p.apodo).includes(q)||(qd.length>=4&&String(p.wa).includes(qd))).slice(0,12);
  $('estado').textContent=hits.length?'':'No la encontré.';
  $('res').innerHTML=hits.map(p=>'<button class="res" type="button" data-id="'+esc(p.id)+'"><b>'+esc(p.apodo)+' · '+esc(p.nombre)+'</b><small>'+esc(p.id)+(p.wa?' · WhatsApp …'+esc(String(p.wa).slice(-4)):'')+'</small></button>').join('');
}
function pintar(c,msg){
  actual=c;
  $('vBuscar').hidden=true;$('vClienta').hidden=false;$('aInicio').hidden=true;$('aBuscar').hidden=false;
  $('aviso').textContent=msg||'';$('aviso').hidden=!msg;
  $('tit').textContent=c.apodo+' · '+c.id;
  $('sub').textContent=[TIPOS[c.tipo]||c.tipo,c.edad!==''?c.edad+' años':''].filter(Boolean).join(' · ');
  CAMPOS.forEach(k=>{$(k).value=c[k]||'';});
  $('bTutor').hidden=c.tipo==='Titular'&&!c.tutor_nombre;
  $('fn').value=c.fn||'';$('claveD').value='';$('lClave').hidden=true;
  if(!$('por').value)$('por').value=leer('ypp_elaboro_alias');
  error('eForm','');
  $('historial').hidden=!c.cambios.length;
  $('historial').innerHTML='<h2>Cambios</h2>'+c.cambios.map(x=>'<div class="ev"><b>'+esc(NOMBRES[x.campo]||x.campo)+'</b> · '+esc(x.por)+' · '+esc(x.fecha)+'<br>'+esc(x.antes||'(vacío)')+' → '+esc(x.despues||'(vacío)')+'</div>').join('');
  scrollTo(0,0);
}
$('q').oninput=buscar;
$('res').onclick=async e=>{
  const b=e.target.closest('[data-id]');if(!b)return;
  $('estado').textContent='Abriendo…';
  try{pintar(await api('consent_clienta_detalle',{id:b.dataset.id}));$('estado').textContent='';}
  catch(x){$('estado').textContent='';error('eBuscar',x.message);}
};
$('aBuscar').onclick=()=>{$('vClienta').hidden=true;$('vBuscar').hidden=false;$('aBuscar').hidden=true;$('aInicio').hidden=false;actual=null;};
$('fn').oninput=()=>{$('lClave').hidden=!actual||$('fn').value===(actual.fn||'');};
$('f').onsubmit=async e=>{
  e.preventDefault();error('eForm','');
  if(!$('por').value.trim())return error('eForm','Escribe quién hace el cambio.');
  const cambiaFecha=$('fn').value!==(actual.fn||'');
  if(cambiaFecha&&!$('claveD').value)return error('eForm','Para cambiar la fecha escribe la clave de Luis y Yoltic.');
  const data={id:actual.id,por:$('por').value.trim(),fn:$('fn').value,clave_duenos:$('claveD').value};
  CAMPOS.forEach(k=>{data[k]=$(k).value;});
  $('bGuardar').disabled=true;
  try{
    const r=await api('consent_clienta_guardar',data);
    LISTA=null;listaProm=null;
    pintar(r.clienta,r.cambios?'Cambios guardados.':'No había nada que cambiar.');
  }catch(x){error('eForm',x.message);$('claveD').value='';}
  $('bGuardar').disabled=false;
};
if(leer('yp_pink_clave'))cargarLista().catch(()=>{});   // la lista ya está lista cuando empiezan a escribir
</script>
</body>
</html>
